<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Servicio de control interno de Fluge Audiovisuales. Accesos a los servicios y equipos del estudio.">
  <title>Fluge Audiovisuales · Servicio de control</title>
  <link rel="icon" href="__FAVICON_DATA__" type="image/svg+xml" sizes="any">
  <style>
    html { color-scheme: dark; scroll-behavior: smooth; }
    body { margin: 0; }
    /* PRODUCT STYLES */
    #fluge-studio {
      --fluge-mint: #6db9b2;
      --fluge-bg: #0e1615;
      --fluge-panel: #16201f;
      --fluge-line: #2b3a37;
      --fluge-text: #f6f8f7;
      --fluge-muted: #a9b9b5;
      --fluge-card-padding: 26px;
      --fluge-art-opacity: .18;
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      background: linear-gradient(145deg, #101c19, #080e0c 70%);
      color: var(--fluge-text);
      font: 400 16px/1.55 Arial, Helvetica, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #fluge-studio *, #fluge-studio *::before, #fluge-studio *::after { box-sizing: border-box; }
    #fluge-studio h1, #fluge-studio h2, #fluge-studio h3 { font-family: Arial, Helvetica, system-ui, sans-serif; }
    #fluge-studio [hidden] { display: none !important; }
    #fluge-studio a { color: inherit; text-decoration: none; }
    #fluge-studio a:hover { text-decoration: underline; text-underline-offset: 4px; }
    #fluge-studio a:focus-visible, #fluge-studio input:focus-visible { outline: 2px solid var(--fluge-mint); outline-offset: 5px; }
    #fluge-studio .page-art { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    #fluge-studio .page-art::before { content: ""; position: absolute; inset: -60% 36% -60% -10%; transform: rotate(-40deg); background: linear-gradient(90deg, #335854, #6db9b2); opacity: var(--fluge-art-opacity); }
    #fluge-studio .page-art::after { content: ""; position: absolute; inset: -60% -15% -60% 54%; transform: rotate(-40deg); background: #080e0c; opacity: .72; }
    #fluge-studio .art-line { position: absolute; left: -40%; top: 50%; width: 180%; height: 1px; background: #a5d1c8; opacity: .08; transform: rotate(-40deg); z-index: 1; }
    #fluge-studio .art-line:nth-child(2) { top: 24%; }
    #fluge-studio .art-line:nth-child(3) { top: 76%; }
    #fluge-studio .shell { position: relative; z-index: 1; width: min(1180px, calc(100% - 64px)); margin: 0 auto; }
    #fluge-studio .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 28px; min-height: 112px; padding: 22px 0; border-bottom: 1px solid #46645c; }
    #fluge-studio .brand-group { display: flex; min-width: 0; align-items: center; gap: 26px; }
    #fluge-studio .brand { display: inline-flex; align-items: center; min-height: 44px; flex-shrink: 0; }
    #fluge-studio .brand img { display: block; width: 184px; height: auto; }
    #fluge-studio .brand-title { margin: 0; padding-left: 26px; border-left: 1px solid #65877b; font-size: 1.25rem; line-height: 1.3; font-weight: 400; }
    #fluge-studio .header-right { display: flex; min-width: 0; align-items: center; gap: 30px; }
    #fluge-studio .header-link { font-size: .875rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    #fluge-studio .network { display: inline-flex; min-width: 0; align-items: center; gap: 12px; padding: 10px 15px; border: 1px solid #46645c; background: #12211d; color: #bcd4ce; font: .8125rem/1.4 Consolas, "Courier New", monospace; overflow-wrap: anywhere; }
    #fluge-studio .network-label { color: var(--fluge-mint); font-family: Arial, Helvetica, sans-serif; font-size: .75rem; font-weight: 700; letter-spacing: .08em; }
    #fluge-studio .directory { padding: 36px 0 28px; }
    #fluge-studio .directory-top { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    #fluge-studio .directory-title { margin: 0; font-size: 1.375rem; line-height: 1.3; font-weight: 500; letter-spacing: -.015em; }
    #fluge-studio .directory-total { margin: 0; color: #d3e0db; font-size: .8125rem; }
    #fluge-studio .search { position: relative; display: flex; align-items: center; margin-bottom: 29px; }
    #fluge-studio .search-mark { position: absolute; left: 20px; width: 15px; height: 15px; border: 1.5px solid var(--fluge-muted); border-radius: 50%; pointer-events: none; }
    #fluge-studio .search-mark::after { content: ""; position: absolute; width: 6px; height: 1.5px; background: var(--fluge-muted); transform: rotate(45deg); right: -4px; bottom: -2px; }
    #fluge-studio input { display: block; width: 100%; min-width: 0; padding: 17px 65px 17px 50px; border: 1px solid var(--fluge-line); border-radius: 0; background: #121d1a; color: var(--fluge-text); font: inherit; font-size: 1rem; }
    #fluge-studio input::placeholder { color: #a4b4af; opacity: 1; }
    #fluge-studio .search-key { position: absolute; right: 19px; padding: 0 8px; border: 1px solid #42544e; color: #b3c5bf; font: .875rem/1.55 Consolas, "Courier New", monospace; pointer-events: none; }
    #fluge-studio #services { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 22px; }
    #fluge-studio .group { min-width: 0; }
    #fluge-studio .group[data-group-size="wide"] { grid-column: 1 / -1; }
    #fluge-studio .group-heading { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
    #fluge-studio .group-heading::after { content: ""; height: 1px; background: var(--fluge-line); flex: 1; }
    #fluge-studio .group-heading h2 { margin: 0; color: #e6eeea; font-size: .875rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
    #fluge-studio .group-count { color: #c6dbd0; font: .75rem/1.4 Consolas, "Courier New", monospace; }
    #fluge-studio .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
    #fluge-studio .group[data-group-size="wide"] .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #fluge-studio .service-card { position: relative; display: flex; flex-direction: column; min-width: 0; height: 100%; padding: var(--fluge-card-padding); border: 1px solid var(--fluge-line); background: var(--fluge-panel); transition: border-color .15s, background .15s; }
    #fluge-studio .service-card:hover { border-color: #56776d; background: #1a2824; }
    #fluge-studio .card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    #fluge-studio .service-symbol { display: grid; place-items: center; width: 43px; height: 37px; flex-shrink: 0; border: 1px solid #3d5850; color: #afd5c9; font: 600 .8125rem/1 Consolas, "Courier New", monospace; letter-spacing: .03em; }
    #fluge-studio .access-type { color: #b4c8c0; font-size: .75rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
    #fluge-studio .access-type-dns { color: var(--fluge-mint); }
    #fluge-studio .service-card h3 { margin: 0 0 8px; font-size: 1.4375rem; line-height: 1.3; font-weight: 500; letter-spacing: -.025em; overflow-wrap: anywhere; }
    #fluge-studio .service-card p { margin: 0 0 17px; color: var(--fluge-muted); font-size: 1rem; line-height: 1.55; }
    #fluge-studio .endpoint { margin-top: auto; padding: 0 0 17px; color: #a4bfb4; font: .8125rem/1.4 Consolas, "Courier New", monospace; overflow-wrap: anywhere; }
    #fluge-studio .card-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 13px; padding-top: 17px; border-top: 1px solid var(--fluge-line); }
    #fluge-studio .open { display: inline-flex; align-items: center; justify-content: center; min-height: 43px; padding: 9px 19px; background: var(--fluge-mint); color: #102620; font-size: .875rem; font-weight: 700; transition: background .15s; }
    #fluge-studio .open:hover { background: #8bd0c4; text-decoration: none; }
    #fluge-studio .shortcut { color: #cbdbd4; font: .8125rem/1.5 Consolas, "Courier New", monospace; overflow-wrap: anywhere; }
    #fluge-studio code.shortcut { padding: 0; border: 0; border-radius: 0; background: transparent; }
    #fluge-studio a.shortcut:hover { color: var(--fluge-mint); }
    #fluge-studio .dns-note { display: inline-flex; align-items: center; min-height: 43px; color: var(--fluge-mint); font-size: .8125rem; }
    #fluge-studio .empty { margin: 18px 0 0; padding: 32px 0; color: var(--fluge-muted); text-align: center; }
    #fluge-studio .footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 18px; padding: 24px 0 28px; border-top: 1px solid #46645c; color: #d0e1d7; font-size: .75rem; }
    #fluge-studio .footer-brand { color: #d1ded6; font-size: .75rem; font-weight: 700; letter-spacing: .12em; }
    #fluge-studio .footer-note { margin: 0; }
    #fluge-studio .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 600px) {
      #fluge-studio .shell { width: calc(100% - 36px); }
      #fluge-studio .topbar { min-height: 96px; gap: 16px; padding: 20px 0; }
      #fluge-studio .brand-group { width: 100%; gap: 16px; }
      #fluge-studio .brand img { width: 128px; }
      #fluge-studio .brand-title { padding-left: 16px; font-size: 1rem; }
      #fluge-studio .header-link, #fluge-studio .network-label { display: none; }
      #fluge-studio .header-right { width: 100%; justify-content: flex-end; gap: 0; }
      #fluge-studio .network { padding: 7px 9px; font-size: .75rem; }
      #fluge-studio .directory { padding-top: 26px; }
      #fluge-studio .directory-top { align-items: flex-start; flex-direction: column; gap: 6px; }
      #fluge-studio .directory-title { font-size: 1.25rem; }
      #fluge-studio .directory-total { font-size: .8125rem; }
      #fluge-studio input { padding: 16px 19px 16px 46px; }
      #fluge-studio .search-mark { left: 17px; }
      #fluge-studio .search-key { display: none; }
      #fluge-studio #services, #fluge-studio .group[data-group-size="wide"] .grid { grid-template-columns: minmax(0, 1fr); }
      #fluge-studio .service-card { padding: 22px; }
      #fluge-studio .footer { align-items: flex-start; flex-direction: column; gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      #fluge-studio *, #fluge-studio *::before, #fluge-studio *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="fluge-studio">
    <div class="page-art" aria-hidden="true"><span class="art-line"></span><span class="art-line"></span><span class="art-line"></span></div>
    <div class="shell">
      <header class="topbar">
        <div class="brand-group"><a class="brand" href="#fluge-studio" aria-label="Fluge Audiovisuales · Inicio"><img src="__LOGO_DATA__" alt="Fluge Audiovisuales" width="217" height="68"></a><h1 class="brand-title">Servicio de control</h1></div>
        <div class="header-right"><a class="header-link" href="#directorio">Servicios</a><span class="network"><span class="network-label">RED LOCAL</span>__LANDING_HOST__</span></div>
      </header>
      <main>
        <section class="directory" id="directorio" aria-labelledby="directory-title">
          <div class="directory-top"><h2 class="directory-title" id="directory-title">Servicios del estudio</h2><p class="directory-total">__COUNT__ servicios · __CATEGORY_COUNT__ categorías</p></div>
          <div class="search"><label class="sr-only" for="search">Buscar equipos y servicios</label><span class="search-mark" aria-hidden="true"></span><input id="search" type="search" autocomplete="off" placeholder="Buscar servicio, IP o dominio…" aria-controls="services" aria-describedby="results"><kbd class="search-key" aria-hidden="true">/</kbd></div>
          <div id="services"><!-- SERVICES --></div>
          <p class="empty" id="empty" hidden>No hay servicios que coincidan con tu búsqueda.</p>
          <p class="sr-only" id="results" role="status" aria-live="polite"></p>
        </section>
      </main>
      <footer class="footer"><span class="footer-brand">FLUGE AUDIOVISUALES</span><p class="footer-note">Servicio de control interno · __DOMAIN__</p></footer>
    </div>
  </div>
  <script>
    (() => {
      const root = document.getElementById('fluge-studio');
      const input = root.querySelector('#search');
      const groups = [...root.querySelectorAll('.group')];
      const normalize = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('es');
      const cards = [...root.querySelectorAll('.service-card')].map(element => ({element, text: normalize(element.dataset.search)}));
      input.addEventListener('input', () => {
        const words = normalize(input.value).trim().split(/\s+/).filter(Boolean);
        let visible = 0;
        cards.forEach(({element, text}) => {
          element.hidden = !words.every(word => text.includes(word));
          if (!element.hidden) visible++;
        });
        groups.forEach(group => {
          const count = group.querySelectorAll('.service-card:not([hidden])').length;
          group.hidden = count === 0;
          group.querySelector('.group-count').textContent = String(count);
        });
        root.querySelector('#empty').hidden = visible !== 0;
        root.querySelector('#results').textContent = `${visible} servicios encontrados`;
      });
      document.addEventListener('keydown', event => {
        if (event.key === '/' && event.target !== input && !/INPUT|TEXTAREA|SELECT/.test(event.target.tagName) && !event.target.isContentEditable) {
          event.preventDefault(); input.focus();
        }
        if (event.key === 'Escape' && event.target === input) { input.value = ''; input.dispatchEvent(new Event('input')); }
      });
    })();
  </script>
</body>
</html>
